version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  api:
    build: .
    restart: always
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  
  bot:
    build: .
    restart: always
    command: python -m src.bot.main
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - api
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api
  
  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--domain=property-nemeses-encroach.ngrok-free.dev"
      - "frontend:5173"
    ports:
      - "4040:4040"
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data: